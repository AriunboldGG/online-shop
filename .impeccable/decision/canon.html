<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category standard sketch</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:390px; height:844px; overflow:hidden; background:#fff; color:#111; font-family:"Segoe UI",system-ui,sans-serif; }
  .bar { background:#111; color:#fff; font:600 12px/32px system-ui; text-align:center; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee; font-weight:800; font-size:20px; }
  .hero { margin:16px; height:360px; background:#f1f1f1; border-radius:4px; display:flex; flex-direction:column; justify-content:flex-end; padding:20px; }
  .hero h1 { font-size:30px; }
  .hero span { margin-top:12px; align-self:flex-start; background:#e11d48; color:#fff; padding:12px 20px; font-weight:700; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px; }
  .tiles div { height:150px; background:#f5f5f5; display:flex; align-items:flex-end; padding:10px; font-weight:700; }
</style>
</head>
<body>
  <div class="bar">Солонгосоос импортолсон бараа</div>
  <header><span>☰</span><span>Online Shop</span><span>🛒</span></header>
  <div class="hero"><h1>Хаврын шинэ цуглуулга</h1><span>Дэлгүүр үзэх</span></div>
  <div class="tiles"><div>Хувцас</div><div>Гутал</div><div>Гэр ахуй</div><div>Тавилга</div></div>
</body>
</html>
